# ============================================================
# BigStock Frontend Nginx
#
# Architecture:
#
# Browser
#   ↓
# Cloudflare Tunnel
#   ↓
# Traefik
#   ↓
# Nginx :80
#   ├── Vue SPA
#   ├── Firebase Service Worker
#   ├── Runtime Config
#   ├── /api/* → Spring Boot :18080
#   └── /ws/*  → Spring Boot :18080
#
# Nginx version: >= 1.29.3
# ============================================================


# ============================================================
# 1. Docker DNS - Dynamic Backend Resolution
# ============================================================

upstream bigstock_backend {

    zone bigstock_backend 64k;

    # Backend Docker DNS alias
    server biz:18080 resolve;

    # Docker embedded DNS
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Reuse backend connections
    keepalive 16;
}


# ============================================================
# 2. WebSocket Connection Header
# ============================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}


# ============================================================
# 3. Frontend HTTP Server
# ============================================================

server {

    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;


    # ========================================================
    # 4. Security Headers
    # ========================================================

    # Keep parent security headers even when a location
    # defines its own Cache-Control or other headers.
    #
    # Requires Nginx >= 1.29.3
    add_header_inherit merge;


    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options
        "nosniff" always;


    # Prevent clickjacking
    add_header X-Frame-Options
        "DENY" always;


    # Restrict Referer disclosure
    add_header Referrer-Policy
        "strict-origin-when-cross-origin" always;


    # Disable unused browser capabilities
    add_header Permissions-Policy
        "camera=(), microphone=(), geolocation=()" always;


    # Reduce cross-origin information leakage
    add_header Cross-Origin-Opener-Policy
        "same-origin" always;


    # CSP report-only starter policy.
    #
    # Firebase, Turnstile, ECharts and other integrations
    # must be evaluated before enforcing a strict CSP.
    #
    # Intentionally does not include a restrictive
    # connect-src or script-src yet.
    add_header Content-Security-Policy-Report-Only
        "object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
        always;


    # ========================================================
    # 5. Runtime Config - Vue
    # ========================================================

    location = /config.js {

        default_type application/javascript;

        add_header Cache-Control
            "no-store" always;

        try_files /config.js =404;
    }


    # ========================================================
    # 6. Runtime Config - Firebase
    # ========================================================

    location = /runtime-config.json {

        default_type application/json;

        add_header Cache-Control
            "no-store" always;

        try_files /runtime-config.json =404;
    }


    # ========================================================
    # 7. Firebase Messaging Service Worker
    # ========================================================

    location = /firebase-messaging-sw.js {

        default_type application/javascript;

        add_header Cache-Control
            "no-store" always;

        add_header Service-Worker-Allowed
            "/" always;

        try_files /firebase-messaging-sw.js =404;
    }


    # ========================================================
    # 8. Vue index.html
    # ========================================================

    location = /index.html {

        add_header Cache-Control
            "no-cache" always;

        try_files /index.html =404;
    }


    # ========================================================
    # 9. Vue Static Assets
    # ========================================================

    location /assets/ {

        add_header Cache-Control
            "public, max-age=31536000, immutable" always;

        try_files $uri =404;
    }


    # ========================================================
    # 10. REST API
    #
    # Frontend:
    # /api/device/web/register
    #
    # Backend:
    # /device/web/register
    #
    # Strip exactly one /api prefix
    # ========================================================

    location /api/ {

        proxy_pass http://bigstock_backend/;

        proxy_http_version 1.1;

        # Preserve original request information
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto
            $http_x_forwarded_proto;

        proxy_set_header X-Forwarded-Host
            $host;

        # Connection management
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Response buffering
        proxy_buffering on;

        # Do not cache API responses
        add_header Cache-Control
            "no-store" always;

        # Avoid rewriting redirects automatically
        proxy_redirect off;
    }


    # ========================================================
    # 11. WebSocket / SockJS / STOMP
    #
    # Preserve original /ws paths
    #
    # /ws
    # /ws/info
    # /ws/{server}/{session}/websocket
    # /ws/{server}/{session}/xhr_streaming
    # ========================================================

    location /ws {

        proxy_pass http://bigstock_backend;

        proxy_http_version 1.1;

        # WebSocket Upgrade
        proxy_set_header Upgrade
            $http_upgrade;

        proxy_set_header Connection
            $connection_upgrade;

        # Preserve Host
        proxy_set_header Host
            $host;

        proxy_set_header X-Real-IP
            $remote_addr;

        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto
            $http_x_forwarded_proto;

        # Long-lived connections
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Disable buffering for streaming
        proxy_buffering off;

        # Prevent HTTP response caching
        add_header Cache-Control
            "no-store" always;
    }


    # ========================================================
    # 12. Vue Router SPA Fallback
    #
    # /candlestick
    # /market-live
    # /ranking
    # /calendar
    # ========================================================

    location / {

        add_header Cache-Control
            "no-cache" always;

        try_files $uri $uri/ /index.html;
    }
}