server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        try_files /config.js =404;
    }

    location = /runtime-config.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        try_files /runtime-config.json =404;
    }

    location = /firebase-messaging-sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        try_files /firebase-messaging-sw.js =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 處理重複的 /api 前綴
    location /api/ {

        # /api/api/device/web/register
        # → /api/device/web/register
        rewrite ^/api/api/(.*)$ /api/$1 break;

        proxy_pass http://biz:18080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}