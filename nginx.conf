# ============================================================
# BigStock Frontend Nginx - Security Hardened
#
# Architecture:
#
# Browser
#    |
#    v
# Cloudflare Tunnel
#    |
#    v
# Traefik / Dokploy
#    |
#    v
# Nginx :80
#    |
#    +-- Vue 3 SPA
#    +-- Runtime Config
#    +-- /api/* -> Spring Boot :18080
#    +-- /ws*   -> Spring Boot :18080
#
# Security:
#
# - Hide Nginx version
# - Disable duplicate access logs
# - Restrict sensitive files
# - Block source maps
# - Block TRACE
# - Hide unnecessary upstream headers
# - Enforce Content Security Policy
# - Preserve API / WebSocket functionality
#
# Requirement:
# Nginx >= 1.29.3
# ============================================================


# ============================================================
# 1. Docker DNS - Dynamic Backend Resolution
# ============================================================

upstream bigstock_backend {

    zone bigstock_backend 64k;

    server biz:18080 resolve;

    resolver 127.0.0.11
        valid=10s
        ipv6=off;

    resolver_timeout 5s;

    keepalive 16;
}


# ============================================================
# 2. WebSocket Connection Header
# ============================================================

map $http_upgrade $connection_upgrade {

    default upgrade;

    '' close;
}


# ============================================================
# 3. Frontend HTTP Server
# ============================================================

server {

    listen 80;

    server_name _;

    root /usr/share/nginx/html;

    index index.html;


    # ========================================================
    # 4. Server Information Protection
    # ========================================================

    # Hide exact Nginx version.
    #
    # Server: nginx/1.xx.x
    #
    # becomes:
    #
    # Server: nginx

    server_tokens off;


    # ========================================================
    # 5. Logging Security
    # ========================================================

    # Traefik already provides JSON access logs.
    #
    # Avoid duplicated request logging in Nginx.
    # This also reduces exposure of sensitive query strings.

    access_log off;


    # Keep warnings and errors for operational debugging.
    #
    # Never disable error logs completely.

    error_log /dev/stderr warn;


    # ========================================================
    # 6. Request Restrictions
    # ========================================================

    # Reject HTTP TRACE.
    #
    # Do not interfere with GET / POST / PUT / PATCH / DELETE.

    if ($request_method = TRACE) {
        return 405;
    }


    # ========================================================
    # 7. General Security Headers
    # ========================================================

    # Keep parent security headers when locations define
    # Cache-Control or other response headers.
    #
    # Requires Nginx >= 1.29.3.

    add_header_inherit merge;


    # --------------------------------------------------------
    # MIME Sniffing Protection
    # --------------------------------------------------------

    add_header X-Content-Type-Options
        "nosniff"
        always;


    # --------------------------------------------------------
    # Clickjacking Protection
    # --------------------------------------------------------

    add_header X-Frame-Options
        "DENY"
        always;


    # --------------------------------------------------------
    # Referer Protection
    # --------------------------------------------------------

    add_header Referrer-Policy
        "strict-origin-when-cross-origin"
        always;


    # --------------------------------------------------------
    # Browser Permission Restrictions
    # --------------------------------------------------------

    add_header Permissions-Policy
        "camera=(), microphone=(), geolocation=()"
        always;


    # --------------------------------------------------------
    # Cross-Origin Isolation
    # --------------------------------------------------------

    add_header Cross-Origin-Opener-Policy
        "same-origin"
        always;


    # ========================================================
    # 8. Content Security Policy
    # ========================================================

    # Strict source allowlist for BigStock.
    #
    # Vue / Vite:
    #   script-src 'self'
    #
    # Cloudflare Turnstile:
    #   challenges.cloudflare.com
    #
    # WebSocket:
    #   api.bigstockserver.link
    #
    # ECharts:
    #   Allow inline styles for compatibility.
    #
    # IMPORTANT:
    # If a different WebSocket hostname is used,
    # update connect-src accordingly.
    #
    # If external fonts/images/CDNs are used,
    # allow only the required origins.

    add_header Content-Security-Policy
        "default-src 'none';
         script-src 'self' https://challenges.cloudflare.com;
         script-src-attr 'none';
         style-src 'self' 'unsafe-inline';
         img-src 'self' data: blob:;
         font-src 'self';
         connect-src 'self' wss://api.bigstockserver.link https://challenges.cloudflare.com;
         frame-src https://challenges.cloudflare.com;
         worker-src 'self' blob:;
         object-src 'none';
         base-uri 'none';
         form-action 'self';
         frame-ancestors 'none';
         manifest-src 'self';
         upgrade-insecure-requests"
        always;


    # ========================================================
    # 9. Sensitive File Protection
    # ========================================================

    # IMPORTANT:
    #
    # These regular-expression locations must remain
    # reachable during Nginx location matching.
    #
    # Do not blindly change /assets/ to ^~ /assets/
    # or source-map blocking may be bypassed.


    # --------------------------------------------------------
    # Block Hidden Files
    # --------------------------------------------------------

    # Examples:
    #
    # /.env
    # /.git/config
    # /.svn/
    # /.htaccess
    #
    # Return 404 instead of disclosing file existence.

    location ~ (^|/)\. {

        return 404;
    }


    # --------------------------------------------------------
    # Block JavaScript / CSS Source Maps
    # --------------------------------------------------------

    # Examples:
    #
    # /assets/index.js.map
    # /assets/app.css.map

    location ~* \.map$ {

        return 404;
    }


    # --------------------------------------------------------
    # Block Common Sensitive File Extensions
    # --------------------------------------------------------

    # Avoid exposing accidentally deployed:
    #
    # - backups
    # - database dumps
    # - private keys
    # - configuration files
    #
    # Do not block .json / .js / .css:
    # those are needed by Vue.

    location ~* \.(bak|backup|old|orig|save|swp|swo|sql|sqlite|db|pem|key|p12|pfx|jks|keystore)$ {

        return 404;
    }


    # --------------------------------------------------------
    # Block Common Sensitive Filenames
    # --------------------------------------------------------

    location ~* (^|/)(Dockerfile|docker-compose\.ya?ml|Makefile|package-lock\.json|pnpm-lock\.yaml|yarn\.lock)$ {

        return 404;
    }


    # ========================================================
    # 10. Runtime Config - Vue
    # ========================================================

    # Browser-readable configuration.
    #
    # Must never contain:
    #
    # - JWT signing secret
    # - Turnstile secret key
    # - Database passwords
    # - Redis passwords
    # - Private API credentials

    location = /config.js {

        default_type application/javascript;

        add_header Cache-Control
            "no-store"
            always;

        try_files /config.js =404;
    }


    # ========================================================
    # 11. Runtime Config - Legacy Firebase
    # ========================================================

    # Kept for backward compatibility.
    #
    # Remove after confirming Web Firebase has been
    # completely removed from the deployed frontend.

    location = /runtime-config.json {

        default_type application/json;

        add_header Cache-Control
            "no-store"
            always;

        try_files /runtime-config.json =404;
    }


    # ========================================================
    # 12. Legacy Firebase Service Worker
    # ========================================================

    # Kept temporarily to avoid disrupting existing
    # browser installations.
    #
    # Remove after Service Worker migration is complete.

    location = /firebase-messaging-sw.js {

        default_type application/javascript;

        add_header Cache-Control
            "no-store"
            always;

        add_header Service-Worker-Allowed
            "/"
            always;

        try_files /firebase-messaging-sw.js =404;
    }


    # ========================================================
    # 13. Vue index.html
    # ========================================================

    # Do not use immutable caching for the SPA entry point.
    #
    # A new deployment must be able to load its updated
    # JavaScript and CSS asset references.

    location = /index.html {

        add_header Cache-Control
            "no-cache"
            always;

        try_files /index.html =404;
    }


    # ========================================================
    # 14. Vue Static Assets
    # ========================================================

    # Vite uses hashed filenames for production assets.
    #
    # Examples:
    #
    # /assets/index-xxxxx.js
    # /assets/index-xxxxx.css
    #
    # Regular expression security locations above are
    # still checked before this prefix location is used.

    location /assets/ {

        add_header Cache-Control
            "public, max-age=31536000, immutable"
            always;

        try_files $uri =404;
    }


    # ========================================================
    # 15. Spring Boot REST API
    # ========================================================

    # Frontend:
    #
    # /api/biz/allNews
    #
    # Backend:
    #
    # /biz/allNews
    #
    # Strip exactly one /api prefix.
    #
    # Security responsibilities:
    #
    # - JWT: Spring Security
    # - CSRF: Spring Security
    # - CORS: Spring Security
    # - Rate Limit: Traefik + Redis
    #
    # Nginx must preserve authentication-related headers.

    location ^~ /api/ {

        proxy_pass http://bigstock_backend/;

        proxy_http_version 1.1;


        # ----------------------------------------------------
        # Upstream Request Headers
        # ----------------------------------------------------

        proxy_set_header Host
            $host;

        proxy_set_header X-Real-IP
            $remote_addr;

        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto
            $http_x_forwarded_proto;

        proxy_set_header X-Forwarded-Host
            $host;


        # ----------------------------------------------------
        # Connection Management
        # ----------------------------------------------------

        proxy_set_header Connection "";


        # ----------------------------------------------------
        # Timeouts
        # ----------------------------------------------------

        proxy_connect_timeout 10s;

        proxy_read_timeout 120s;

        proxy_send_timeout 120s;


        # ----------------------------------------------------
        # Response Buffering
        # ----------------------------------------------------

        proxy_buffering on;


        # ----------------------------------------------------
        # Sensitive Upstream Header Protection
        # ----------------------------------------------------

        # Hide framework fingerprints where present.
        #
        # Do not remove Set-Cookie,
        # WWW-Authenticate or CORS headers.

        proxy_hide_header X-Powered-By;

        proxy_hide_header X-AspNet-Version;

        proxy_hide_header X-Generator;


        # ----------------------------------------------------
        # Response Cache Protection
        # ----------------------------------------------------

        add_header Cache-Control
            "no-store"
            always;


        # ----------------------------------------------------
        # Redirect Handling
        # ----------------------------------------------------

        proxy_redirect off;
    }


    # ========================================================
    # 16. WebSocket / SockJS / STOMP
    # ========================================================

    # Preserve existing /ws paths.
    #
    # /ws
    # /ws/info
    # /ws/{server}/{session}/websocket
    # /ws/{server}/{session}/xhr_streaming
    #
    # Do not apply short REST request timeouts
    # to long-lived WebSocket connections.

    location ^~ /ws {

        proxy_pass http://bigstock_backend;

        proxy_http_version 1.1;


        # ----------------------------------------------------
        # WebSocket Upgrade
        # ----------------------------------------------------

        proxy_set_header Upgrade
            $http_upgrade;

        proxy_set_header Connection
            $connection_upgrade;


        # ----------------------------------------------------
        # Upstream Request Headers
        # ----------------------------------------------------

        proxy_set_header Host
            $host;

        proxy_set_header X-Real-IP
            $remote_addr;

        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto
            $http_x_forwarded_proto;


        # ----------------------------------------------------
        # Long-Lived Connections
        # ----------------------------------------------------

        proxy_connect_timeout 10s;

        proxy_read_timeout 3600s;

        proxy_send_timeout 3600s;


        # ----------------------------------------------------
        # Disable Streaming Buffer
        # ----------------------------------------------------

        proxy_buffering off;


        # ----------------------------------------------------
        # Hide Unnecessary Upstream Headers
        # ----------------------------------------------------

        proxy_hide_header X-Powered-By;

        proxy_hide_header X-AspNet-Version;

        proxy_hide_header X-Generator;


        # ----------------------------------------------------
        # Disable Response Caching
        # ----------------------------------------------------

        add_header Cache-Control
            "no-store"
            always;
    }


    # ========================================================
    # 17. Vue Router SPA Fallback
    # ========================================================

    # Supported routes:
    #
    # /
    # /candlestick
    # /stock/:stockCode
    # /market-live
    # /news
    # /ranking
    # /calendar
    #
    # Unknown frontend routes will be handled by Vue Router.
    #
    # Existing files are served directly.

    location / {

        add_header Cache-Control
            "no-cache"
            always;

        try_files $uri $uri/ /index.html;
    }

}