name: BigStock Frontend CI

on:
  push:
    tags:
      - 'vf*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_REPO: isaac0410/bstock-all-in-one

jobs:
  build-frontend:
    name: Build and Push Frontend Image

    if: startsWith(github.ref, 'refs/tags/vf')

    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. Checkout Source
      # ==========================================
      - name: Checkout Source
        uses: actions/checkout@v4

      # ==========================================
      # 2. Setup Node
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ==========================================
      # 3. Install Dependencies
      # ==========================================
      - name: Install Dependencies
        run: npm ci

      # ==========================================
      # 4. TypeScript Check
      # ==========================================
      - name: TypeScript Check
        run: npx vue-tsc --noEmit

      # ==========================================
      # 5. Vue Production Build
      # ==========================================
      - name: Build Vue
        run: npm run build

      # ==========================================
      # 6. Verify Build Artifacts
      # ==========================================
      - name: Verify Build Artifacts
        run: |
          test -f dist/index.html
          test -f dist/firebase-messaging-sw.js
          test -f Dockerfile
          test -f nginx/default.conf.template
          test -f docker/40-runtime-config.sh

      # ==========================================
      # 7. Login Docker Registry
      # ==========================================
      - name: Login Docker Registry
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login \
            -u "$DOCKER_USERNAME" \
            --password-stdin "$DOCKER_REGISTRY"

      # ==========================================
      # 8. Build Docker Image
      # ==========================================
      - name: Build Docker Image
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          docker build \
            -t "${IMAGE_REPO}:${IMAGE_TAG}" \
            .

      # ==========================================
      # 9. Push Docker Image to Docker Hub
      # ==========================================
      - name: Push Docker Image
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          docker push "${IMAGE_REPO}:${IMAGE_TAG}"

      # ==========================================
      # 10. Output
      # ==========================================
      - name: Print Image Reference
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          echo "Docker image pushed successfully:"
          echo "docker.io/${IMAGE_REPO}:${IMAGE_TAG}"

          echo "## BigStock Frontend Docker Image" >> "$GITHUB_STEP_SUMMARY"
          echo "docker.io/${IMAGE_REPO}:${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"